<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080A19">
<title>Ramallah Expo — معاينة التصميم الجديد</title>
<link href="https://db.onlinewebfonts.com/c/13ab13418f633c1b0516fed6e30bedbc?family=Suisse+Int%27l" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Suisse Intl','Segoe UI',Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font-family:inherit;border:none;background:none;cursor:pointer}
a{text-decoration:none}

/* ===== KEYFRAMES ===== */
@keyframes fade-up    { from{opacity:0;transform:translateY(24px)}  to{opacity:1;transform:translateY(0)} }
@keyframes fade-down  { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
@keyframes fade-scale { from{opacity:0;transform:scale(.92)}        to{opacity:1;transform:scale(1)} }
@keyframes bar-grow   { from{transform:scaleY(0);opacity:0}         to{transform:scaleY(1);opacity:1} }

.animate-fade-up   {opacity:0;animation:fade-up    .8s cubic-bezier(.16,1,.3,1) forwards}
.animate-fade-down {opacity:0;animation:fade-down  .7s cubic-bezier(.16,1,.3,1) forwards}
.animate-fade-scale{opacity:0;animation:fade-scale .9s cubic-bezier(.16,1,.3,1) forwards}
.animate-bar-grow  {opacity:0;animation:bar-grow   .6s cubic-bezier(.16,1,.3,1) forwards}

/* ===== SECTION ===== */
.hero-section{
  position:relative;width:100%;
  height:100vh;height:100dvh;
  overflow:hidden;background:#080A19;
}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-content{position:relative;z-index:10;height:100%;display:flex;flex-direction:column}

/* ===== SHARED CONTAINER RHYTHM ===== */
.container{width:100%;max-width:1800px;margin:0 auto;padding-left:20px;padding-right:20px}

/* ===== NAV ===== */
.nav{padding-top:20px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:50}

.logo-row{display:flex;align-items:center;gap:10px}
.logo-svg{width:28px;height:28px;display:block}
.wordmark{color:#fff;font-size:22px;font-weight:450;line-height:1;letter-spacing:-.02em}

.nav-pill{
  height:52px;padding:0 24px;display:flex;align-items:center;gap:30px;
  background:rgba(10,7,7,.35);border-radius:11px;
  -webkit-backdrop-filter:blur(17px);backdrop-filter:blur(17px);
}
.nav-item{color:rgba(255,255,255,.8);font-size:14px;font-weight:450;line-height:14px;cursor:pointer;transition:color .2s;white-space:nowrap}
.nav-item:hover{color:#fff}
.nav-item.has-chev{display:flex;align-items:center;gap:5px}
.chev{width:10px;height:10px;opacity:.8;flex-shrink:0}

.auth-pill{
  height:52px;padding:3px;background:rgba(0,0,0,.35);border-radius:13px;
  -webkit-backdrop-filter:blur(17px);backdrop-filter:blur(17px);
  display:flex;align-items:center;gap:5px;
}
.auth-login{height:46px;padding:0 24px;border-radius:11px;color:#fff;font-size:14px;font-weight:450;line-height:14px;transition:background-color .2s;display:inline-flex;align-items:center;white-space:nowrap}
.auth-login:hover{background:rgba(255,255,255,.05)}
.auth-cta{height:46px;padding:0 24px;background:#E9E9E9;border-radius:11px;color:#0A0707;font-size:14px;font-weight:450;line-height:14px;transition:background-color .2s;display:inline-flex;align-items:center;white-space:nowrap}
.auth-cta:hover{background:#fff}

.burger{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:11px;background:rgba(10,7,7,.35);
  -webkit-backdrop-filter:blur(17px);backdrop-filter:blur(17px);
  transition:background-color .2s;
}
.burger:hover{background:rgba(255,255,255,.1)}
.burger-inner{position:relative;width:20px;height:20px}
.burger-inner svg{width:20px;height:20px;color:#fff;position:absolute;inset:0;transition:all .3s ease-out}
.ico-menu{opacity:1;transform:rotate(0) scale(1)}
.ico-x{opacity:0;transform:rotate(-90deg) scale(.75)}
body.menu-open .ico-menu{opacity:0;transform:rotate(90deg) scale(.75)}
body.menu-open .ico-x{opacity:1;transform:rotate(0) scale(1)}

.desktop-only{display:none}
.mobile-only{display:block}

/* ===== HERO ROW ===== */
.hero-row{flex:1;display:flex;align-items:center;padding-top:32px;padding-bottom:32px;min-height:0}
.hero-grid{display:flex;flex-direction:column;gap:40px}
.copy-col{max-width:593px}

.h1{color:#fff;font-size:36px;font-weight:400;line-height:.95;margin-bottom:20px}
.sub{color:rgba(255,255,255,.8);font-size:16px;font-weight:450;line-height:1.3;max-width:370px;margin-bottom:28px}

.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-solid{
  height:46px;padding:0 20px;background:#E9E9E9;border-radius:12px;
  color:#0A0707;font-size:14px;font-weight:450;line-height:15.5px;
  transition:opacity .2s;display:inline-flex;align-items:center;justify-content:center;
}
.btn-solid:hover{opacity:.9}
.btn-ghost{
  height:46px;padding:0 20px;border-radius:12px;border:1px solid #fff;background:transparent;
  color:#fff;font-size:14px;font-weight:450;line-height:15.5px;
  transition:opacity .2s;display:inline-flex;align-items:center;justify-content:center;
}
.btn-ghost:hover{opacity:.8}

/* ===== REVENUE CARD ===== */
.card-wrap{width:100%;max-width:405px;margin-left:auto;margin-right:auto}
.card{
  width:100%;border-radius:24px;background:rgba(17,16,15,.35);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:20px;padding-bottom:20px;
}
.card-label{color:#fff;font-size:16px;font-weight:450;line-height:20px;margin-bottom:12px}
.card-amount{margin-bottom:8px}
.amt-main{color:#fff;font-size:28px;font-weight:450;line-height:1}
.amt-cents{color:rgba(255,255,255,.2);font-size:28px;font-weight:450;line-height:1}
.delta-row{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.delta-badge{padding:7px 6px;background:rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:12px;font-weight:450;line-height:14px}
.delta-cap{color:rgba(255,255,255,.8);font-size:12px;font-weight:450;line-height:14px;opacity:.7}

.chart{position:relative;direction:ltr}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:80px}
.bar{flex:1;border-radius:.5px;transform-origin:bottom}
.grid-lines{position:absolute;inset:0;pointer-events:none}
.grid-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)}
.axis{display:flex;justify-content:space-between;margin-top:12px}
.axis span{font-size:9px;font-weight:450;line-height:10px;color:rgba(255,255,255,.8)}

/* ===== MOBILE MENU OVERLAY ===== */
.overlay{
  position:fixed;inset:0;z-index:40;visibility:hidden;
  transition:all .5s cubic-bezier(.32,.72,0,1);
}
body.menu-open .overlay{visibility:visible}
.overlay-bg{
  position:absolute;inset:0;background:rgba(8,10,25,.9);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  opacity:0;transition:opacity .5s;
}
body.menu-open .overlay-bg{opacity:1}
.panel{
  position:absolute;top:76px;left:16px;right:16px;
  background:rgba(17,16,15,.6);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  border-radius:20px;border:1px solid rgba(255,255,255,.06);
  padding:24px;transform-origin:top;
  opacity:0;transform:translateY(-16px) scale(.97);
  transition:all .5s cubic-bezier(.32,.72,0,1);
}
body.menu-open .panel{opacity:1;transform:translateY(0) scale(1)}
.panel-links{display:flex;flex-direction:column;gap:4px}
.panel-link{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px;border-radius:12px;color:rgba(255,255,255,.9);
  font-size:18px;font-weight:450;
  opacity:0;transform:translateX(12px);
  transition:all .3s;transition-delay:0ms;
}
.panel-link:hover{background:rgba(255,255,255,.06)}
body.menu-open .panel-link{opacity:1;transform:translateX(0)}
body.menu-open .panel-link:nth-child(1){transition-delay:100ms}
body.menu-open .panel-link:nth-child(2){transition-delay:150ms}
body.menu-open .panel-link:nth-child(3){transition-delay:200ms}
body.menu-open .panel-link:nth-child(4){transition-delay:250ms}
.divider{height:1px;background:rgba(255,255,255,.1);margin:20px 0}
.panel-ctas{display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(8px);transition:all .3s;transition-delay:0ms}
body.menu-open .panel-ctas{opacity:1;transform:translateY(0);transition-delay:350ms}
.panel-solid{width:100%;height:50px;background:#E9E9E9;border-radius:12px;color:#0A0707;font-size:15px;font-weight:450;transition:background-color .2s}
.panel-solid:hover{background:#fff}
.panel-ghost{width:100%;height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:15px;font-weight:450;transition:background-color .2s}
.panel-ghost:hover{background:rgba(255,255,255,.05)}

/* ===== sm : >= 640px ===== */
@media (min-width:640px){
  .container{padding-left:32px;padding-right:32px}
  .nav{padding-top:30px}
  .logo-svg{width:32px;height:32px}
  .wordmark{font-size:26px}
  .h1{font-size:52px;margin-bottom:32px}
  .sub{font-size:18px;margin-bottom:40px}
  .cta-row{gap:16px}
  .btn-solid,.btn-ghost{height:51px;padding:0 27px;font-size:15.5px}
  .card{border-radius:33px;padding:32px;padding-bottom:24px}
  .card-label{font-size:20px;margin-bottom:16px}
  .card-amount{margin-bottom:12px}
  .amt-main,.amt-cents{font-size:46px}
  .delta-row{margin-bottom:32px}
  .delta-badge,.delta-cap{font-size:14px}
  .bars{height:100px}
  .axis span{font-size:10px}
  .panel{top:86px;left:24px;right:24px;padding:32px}
}

/* ===== md : >= 768px ===== */
@media (min-width:768px){
  .container{padding-left:82px;padding-right:82px}
  .h1{font-size:64px}
  .sub{font-size:20px}
}

/* ===== lg : >= 1024px ===== */
@media (min-width:1024px){
  .desktop-only{display:block}
  .mobile-only{display:none}
  .hero-grid{flex-direction:row;align-items:center;justify-content:space-between;gap:48px}
  .card-wrap{margin-left:0;margin-right:0}
  .h1{font-size:72px}
}
</style>
</head>
<body>

<section class="hero-section">
  <video class="hero-video" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_092641_de52eb87-daf2-41db-92cb-7a56eae012a5.mp4" autoplay loop muted playsinline></video>

  <div class="hero-content">

    <!-- ===== NAV ===== -->
    <nav class="container nav">
      <div class="animate-fade-down" style="animation-delay:0ms">
        <div class="logo-row">
          <svg class="logo-svg" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="#fff" d="M 256 256 L 178 256 C 150.386 256 128 233.614 128 206 L 128 256 L 0 256 L 0 192 C 0 156.654 28.654 128 64 128 C 99.346 128 128 156.654 128 192 L 128 128 L 256 128 Z M 78 0 C 105.614 0 128 22.386 128 50 L 128 0 L 256 0 L 256 64 C 256 99.346 227.346 128 192 128 C 156.654 128 128 99.346 128 64 L 128 128 L 0 128 L 0 0 Z"/>
          </svg>
          <span class="wordmark">Ramallah Expo</span>
        </div>
      </div>

      <div class="animate-fade-down desktop-only" style="animation-delay:100ms">
        <div class="nav-pill">
          <span class="nav-item has-chev">القبة
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
          <span class="nav-item">الأكشاك</span>
          <span class="nav-item">الرعاية</span>
          <span class="nav-item">الحسابات</span>
        </div>
      </div>

      <div class="animate-fade-down desktop-only" style="animation-delay:200ms">
        <div class="auth-pill">
          <button class="auth-login">دخول</button>
          <button class="auth-cta">احجز القبة</button>
        </div>
      </div>

      <div class="animate-fade-down mobile-only" style="animation-delay:100ms">
        <button class="burger" id="burger" aria-label="فتح القائمة">
          <span class="burger-inner">
            <svg class="ico-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
            <svg class="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </span>
        </button>
      </div>
    </nav>

    <!-- ===== MOBILE MENU OVERLAY (sibling of nav, inside z-10 wrapper so ✕ stays clickable) ===== -->
    <div class="overlay" id="overlay">
      <div class="overlay-bg" id="overlayBg"></div>
      <div class="panel">
        <div class="panel-links">
          <a href="#" class="panel-link">القبة
            <svg style="width:16px;height:16px;opacity:.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </a>
          <a href="#" class="panel-link">الأكشاك</a>
          <a href="#" class="panel-link">الرعاية</a>
          <a href="#" class="panel-link">الحسابات</a>
        </div>
        <div class="divider"></div>
        <div class="panel-ctas">
          <button class="panel-solid">احجز القبة</button>
          <button class="panel-ghost">دخول</button>
        </div>
      </div>
    </div>

    <!-- ===== HERO ROW ===== -->
    <div class="hero-row">
      <div class="container hero-grid">

        <div class="copy-col">
          <div class="animate-fade-up" style="animation-delay:300ms">
            <h1 class="h1">ارفع مناسباتك إلى آفاق جديدة</h1>
          </div>
          <div class="animate-fade-up" style="animation-delay:500ms">
            <p class="sub">قبة معارض ضخمة، أكشاك، رعاية، وحسابات مرتّبة — كل شي بمكان واحد</p>
          </div>
          <div class="animate-fade-up" style="animation-delay:700ms">
            <div class="cta-row">
              <button class="btn-solid">احجز القبة</button>
              <button class="btn-ghost">دخول الحسابات</button>
            </div>
          </div>
        </div>

        <div class="animate-fade-scale card-wrap" style="animation-delay:900ms">
          <div class="card">
            <p class="card-label">إجمالي الدخل</p>
            <p class="card-amount">
              <span class="amt-main">₪155,670</span><span class="amt-cents">.00</span>
            </p>
            <div class="delta-row">
              <span class="delta-badge">+32.4%</span>
              <span class="delta-cap">مقارنة بالفترة السابقة (₪117.5K)</span>
            </div>
            <div class="chart">
              <div class="bars" id="bars"></div>
              <div class="grid-lines" id="gridLines"></div>
              <div class="axis">
                <span style="opacity:1">١</span>
                <span style="opacity:1">٨</span>
                <span style="opacity:1">١٥</span>
                <span style="opacity:.4">٢٢</span>
                <span style="opacity:.4">٣٠</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>

<script>
const BAR_HEIGHTS=[
  23,40,53,40,33,14,7,17,75,65,
  88,75,65,47,33,88,4,7,9,14,
  95,65,79,37,7,40,17,20,62,47,
  92,72
];
const maxHeight=Math.max(...BAR_HEIGHTS);
const barsEl=document.getElementById('bars');
BAR_HEIGHTS.forEach(function(h,i){
  const isProjected=i>=28;
  const heightPercent=(h/maxHeight)*100;
  const d=document.createElement('div');
  d.className='bar animate-bar-grow';
  d.style.height=heightPercent+'%';
  d.style.backgroundColor=isProjected?'rgba(255,255,255,0.1)':'white';
  d.style.animationDelay=(1100+i*30)+'ms';
  barsEl.appendChild(d);
});
const gl=document.getElementById('gridLines');
[0,1,2,3,4].forEach(function(i){
  const d=document.createElement('div');
  d.className='grid-line';
  d.style.left=(((i+1)/5)*100)+'%';
  gl.appendChild(d);
});

const burger=document.getElementById('burger');
const overlayBg=document.getElementById('overlayBg');
function toggleMenu(open){
  document.body.classList.toggle('menu-open',open);
  document.body.style.overflow=open?'hidden':'';
}
burger.addEventListener('click',function(){
  toggleMenu(!document.body.classList.contains('menu-open'));
});
overlayBg.addEventListener('click',function(){ toggleMenu(false); });
</script>

</body>
</html>
